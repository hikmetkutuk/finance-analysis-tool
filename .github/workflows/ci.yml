name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: |
          python -m compileall data pipelines ratio_engine reporting tests main.py valuation.py
      - name: Validate profile configs
        run: |
          python pipelines/validate_profile_configs.py
      - name: Run tests
        run: pytest -q
