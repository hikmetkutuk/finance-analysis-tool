name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: |
          python -m py_compile valuation.py
          python -m py_compile sector.py
          python -m py_compile benchmark_report.py
          python -m py_compile market_data_provider.py
      - name: Run tests
        run: pytest -q
